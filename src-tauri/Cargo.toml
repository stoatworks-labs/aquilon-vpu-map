[package]
name = "aquilon-vpu-map"
version = "1.2.0"
description = "See how an Analog Way LivePremier allocates its VPU mixers"
authors = ["Allan Sargeant"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix is not redundant: it keeps the lib name distinct from the
# bin name, which otherwise collides on Windows.
name = "aquilon_vpu_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
