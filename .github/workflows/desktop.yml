# Desktop app builds.
#
# The server build (npm start / Docker) needs Node on the machine; a tech on a
# show cannot be assumed to have it, or Docker, or a checkout. These are the
# double-click artifacts.
#
# NOT SIGNED. macOS Gatekeeper refuses an unsigned .dmg from the internet with a
# message that reads like corruption rather than a permission prompt — see the
# release notes. Signing goes through the fleet's Apple path when it is wired up
# here; until then this is a known gap, stated rather than hidden.

name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE macOS build for both architectures. Tauri's
          # universal-apple-darwin target compiles both slices and lipos them,
          # so an Intel Mac and an Apple Silicon Mac download the same file.
          #
          # Intel macOS is CROSS-COMPILED on the Apple Silicon runner, as it
          # already was when it had a row of its own. GitHub's macos-13 hosted
          # runners are capacity-dead — jobs queue for hours and effectively
          # never schedule — so never put an x86_64 mac job there.
          #
          # universal-apple-darwin is a Tauri bundling target and NOT a rustup
          # one, so the toolchain step installs `rust_targets` instead; `target`
          # stays what tauri-action is given.
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            name: macOS (universal)
          - platform: ubuntu-22.04
            target: ''
            name: Linux
          - platform: windows-latest
            target: ''
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri's Linux build needs the webkit2gtk stack; nothing else does.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # generate_context! embeds the frontend at COMPILE time, so dist-frontend/
      # must exist before anything cargo does — including the tests. It is
      # generated, not committed, and tauri-action's own beforeBuildCommand runs
      # too late for this step.
      # tauri-action drives the repo's own `tauri` npm script, so the CLI has to
      # be installed. It is the only dependency this repo has, and it is a dev
      # one — the app itself still ships nothing.
      - name: Install the Tauri CLI
        run: npm ci

      - name: Stage the frontend
        run: node scripts/stage-frontend.mjs

      # The read path has its own tests, including one asserting that every
      # frame this app can send is a `get`. Run them before bundling anything.
      - name: Test the read path
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Aquilon VPU Map __VERSION__'
          releaseDraft: false
          prerelease: false

      # Proof that "universal" is universal, rather than a name on a thin
      # binary. simpleVIS once published an arm64-only macos-universal asset
      # and nothing warned; a lost slice looks identical in the build log.
      #
      # Captured and matched with `case`, never piped into grep: steps run as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS bundle is universal
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          appdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$appdir" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "no .app produced in $appdir" >&2; exit 1; }
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          __archs="$( lipo -archs "$app/Contents/MacOS/$exe" )"
          echo "$(basename "$app")/Contents/MacOS/$exe: $__archs"
          case "$__archs" in
            *arm64*) ;;
            *) echo "expected an arm64 slice, got: $__archs" >&2; exit 1 ;;
          esac
          case "$__archs" in
            *x86_64*) ;;
            *) echo "expected an x86_64 slice, got: $__archs" >&2; exit 1 ;;
          esac
